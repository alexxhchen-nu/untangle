<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文献检索厅</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body class="is-sidebar-collapsed">
    <button
      id="sidebarToggle"
      class="sidebar-tab"
      type="button"
      aria-controls="librarySidebar"
      aria-expanded="false"
    >
      <span>目录</span>
    </button>

    <div class="shell">
      <aside id="librarySidebar" class="sidebar" aria-label="目录控制">
        <div class="brand">
          <h1>文献检索厅</h1>
        </div>

        <label class="search-field">
          <span>检索目录</span>
          <input id="searchInput" type="search" placeholder="题名、系列、文件名" autocomplete="off" />
        </label>

        <div class="filters" aria-label="系列筛选">
          <button class="filter is-active" type="button" data-series="all">全部</button>
          <button class="filter" type="button" data-series="nsbd">南水北调</button>
          <button class="filter" type="button" data-series="hebei">河北</button>
        </div>
      </aside>

      <main class="workspace">
        <section class="catalogue" aria-label="PDF 目录">
          <div class="section-heading">
            <p>文献目录</p>
            <span id="activeLabel">全部文献</span>
          </div>
          <div id="bookList" class="book-list"></div>
          <p id="emptyState" class="empty-state" hidden>没有匹配的文献。</p>
        </section>

        <section class="reader" aria-label="PDF 阅读器">
          <div class="reader-toolbar">
            <div>
              <p id="readerSeries" class="reader-series">请选择文献</p>
              <h2 id="readerTitle">从目录中选择 PDF</h2>
            </div>
            <a id="openPdf" class="open-link is-disabled" href="#" target="_blank" rel="noreferrer">下载原文</a>
          </div>

          <div class="viewer-frame">
            <iframe id="pdfFrame" title="PDF preview"></iframe>
            <div id="readerBlank" class="reader-blank">
              <strong>尚未选择文献</strong>
              <span>请在目录中检索或筛选，然后选择一篇 PDF 预览。</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
