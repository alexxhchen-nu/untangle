# ============================================
# 东汉
# ============================================
- id: eastern-han-brick-wuzhu
  dynasty: 东汉
  confidence: 0.80
  conditions:
    tomb_type: 砖室
    chamber_count: 1
    has_coin: 五铢
    has_mirror: true
  evidence: "单室砖墓 + 五铢钱 + 铜镜是东汉中晚期常见组合"
  weight: 1.0

- id: eastern-han-brick-multi
  dynasty: 东汉
  confidence: 0.85
  conditions:
    tomb_type: 砖室
    chamber_count: 2
    has_coin: 五铢
    vessel_combo_contains: [灶, 井]
  evidence: "双室砖墓 + 五铢钱 + 陶灶陶井(模型明器)是东汉典型特征"
  weight: 1.0

- id: eastern-han-brick-cave
  dynasty: 东汉
  confidence: 0.75
  conditions:
    tomb_type: 土洞
    has_coin: 五铢
    has_iron: true
  evidence: "土洞墓 + 五铢钱 + 铁器是东汉中小型墓葬的常见形态"
  weight: 0.8

