# 断代规则库 - 基于考古类型学
# 格式: 条件 -> 断代结果 + 置信度 + 证据

# ============================================
# 商代
# ============================================
- id: shang-dynasty-bronze-ritual
  dynasty: 商代
  confidence: 0.90
  conditions:
    has_bronze: true
    vessel_combo_contains: [鼎, 爵, 斝, 觚]
    has_coin: 无
  evidence: "青铜礼器组合(鼎爵斝觚)是商代墓葬的典型特征，尚无金属货币"
  weight: 1.0

# ============================================
# 西周
# ============================================
- id: western-zhou-bronze-combo
  dynasty: 西周
  confidence: 0.85
  conditions:
    has_bronze: true
    vessel_combo_contains: [鼎, 簋, 壶]
    has_coin: 无
    has_iron: false
  evidence: "青铜鼎簋壶组合是西周礼器制度的核心，铁器尚未普及"
  weight: 1.0

# ============================================
# 春秋战国
# ============================================
- id: spring-autumn-iron-appearance
  dynasty: 春秋战国
  confidence: 0.75
  conditions:
    has_bronze: true
    has_iron: true
    has_coin: 无
  evidence: "青铜器与铁器并存是春秋战国时期的特征，铁器开始出现但未普及"
  weight: 0.8

# ============================================
# 秦代
# ============================================
- id: qin-dynasty-banliang
  dynasty: 秦代
  confidence: 0.85
  conditions:
    has_coin: 半两
    has_bronze: true
    tomb_type: 土坑竖穴
  evidence: "半两钱是秦代统一货币，土坑竖穴墓仍是主流"
  weight: 1.0

